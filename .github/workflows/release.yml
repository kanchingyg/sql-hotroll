name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: box
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U box -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOTROLL_PG_URL: postgres://box@localhost:5432/postgres
      HOTROLL_REQUIRE_PG: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm -v

      - name: Install
        run: bun install --frozen-lockfile || bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Publish to npm with provenance
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "npm already has ${NAME}@${VER}; skipping publish"
          else
            npm publish --access public --provenance || echo "::warning::npm OIDC not configured yet for ${NAME}; publish locally or configure trusted publisher"
          fi

      - name: Publish to JSR with provenance
        run: |
          set -euo pipefail
          npx -y jsr publish --allow-dirty

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
