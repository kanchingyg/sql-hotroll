name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: box
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U box -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOTROLL_PG_URL: postgres://box@localhost:5432/postgres
      HOTROLL_REQUIRE_PG: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile || bun install
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        run: bun test
